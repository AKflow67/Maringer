# Déploiement automatique vers OVH (recette éprouvée Haelberg/Bergeronnette/agencementklein)
# Chaque push sur main déploie metalleriemaringer.com (hébergement Free hosting 100M, cluster029).
# Secrets à créer dans Settings > Secrets and variables > Actions :
#   FTP_SERVER   = ftp.cluster129.hosting.ovh.net
#   FTP_USERNAME = metallq
#   FTP_PASSWORD = mot de passe FTP (défini par Tom dans le manager)
name: Deploy to OVH

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
